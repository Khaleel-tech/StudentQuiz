{% extends 'base.html' %}
{% block title %}Register | Student Interactive System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="fw-bold mb-3">Create Account</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success">Register</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
