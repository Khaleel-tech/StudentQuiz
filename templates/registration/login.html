{% extends 'base.html' %}
{% block title %}Login | Student Interactive System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="fw-bold mb-3">Login</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary">Login</button>
            </form>
            <p class="mt-3 mb-0">No account? <a href="{% url 'register' %}">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
